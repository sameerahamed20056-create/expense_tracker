{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">

        <div class="card p-4 mt-3">

            <h3 class="mb-4 text-center fw-bold">
                <i class="bi bi-plus-circle text-success"></i>
                Add Transaction
            </h3>

            <form action="/add" method="POST">

                <!-- Title -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Title</label>
                    <input type="text" name="title" class="form-control form-control-lg" placeholder="Enter title" required>
                </div>

                <!-- Amount -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Amount</label>
                    <input type="number" name="amount" class="form-control form-control-lg" placeholder="Enter amount" required>
                </div>

                <!-- Category -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Category</label>
                    <select name="category" class="form-select form-select-lg">
                        <option value="Income">Income</option>
                        <option value="Expense">Expense</option>
                    </select>
                </div>

                <!-- Button -->
                <button class="btn btn-success btn-lg w-100 mt-3">
                    <i class="bi bi-check-circle"></i> Add Transaction
                </button>

            </form>

        </div>

    </div>
</div>

{% endblock %}
