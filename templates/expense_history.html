{% extends 'base.html' %}

{% block content %}

<div class="container">

    <!-- Title -->
    <div class="text-center mb-4">
        <h2 class="fw-bold">
             Expense History
        </h2>
        <p class="text-muted">All your income & expense records</p>
    </div>

    <!-- Card wrapper -->
    <div class="card p-3">

        <div class="table-responsive">

            <table class="table table-hover align-middle">

                <thead class="table-dark text-center">

                    <tr>
                        <th>ID</th>
                        <th>Date</th>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Amount</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody class="text-center">

                    {% for e in expenses %}

                    <tr>

                        <td class="fw-semibold">{{ e.id }}</td>

                        <td>{{ e.date }}</td>

                        <td class="fw-semibold">{{ e.title }}</td>

                        <td>
                            {% if e.category == 'Income' %}
                                <span class="badge bg-success">Income</span>
                            {% else %}
                                <span class="badge bg-danger">Expense</span>
                            {% endif %}
                        </td>

                        <td class="fw-bold">
                            ${{ e.amount }}
                        </td>

                        <td>

                            <a href="/edit/{{ e.id }}" class="btn btn-primary btn-sm me-1">
                                <i class="bi bi-pencil-square"></i>
                            </a>

                            <a href="/delete/{{ e.id }}" class="btn btn-danger btn-sm"
                               onclick="return confirm('Are you sure to delete this?')">
                                <i class="bi bi-trash3"></i>
                            </a>

                        </td>

                    </tr>

                    {% endfor %}
